name: Create VBR 13.1.2.57 Release
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/create-vbr-13.1.2.57-release.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create GitHub release and upload packages
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: v13.1.2.57
          RELEASE_NAME: VBR Web UI Chinese Package 13.1.2.57
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const path = require("path");
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            const name = process.env.RELEASE_NAME;
            const body = [
              "Veeam Backup & Replication Web UI 13.1.2.57 非官方简体中文本地化包。",
              "",
              "包含：",
              "- Windows Backup Server 安装包",
              "- Linux Appliance / VSA 安装包",
              "- Windows + Linux 完整包",
              "- SHA256 校验文件",
              "",
              "安装前请确认 Veeam Web UI build 与包版本一致，并先阅读仓库 README。"
            ].join("\\n");

            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name,
                body,
                draft: false,
                prerelease: false,
                generate_release_notes: false
              })).data;
            }

            const assets = [
              "VBR WebUI Chinese Package/VBR-13.1.2.57/VBRWebUiZhCN-13.1.2.57-linux.tar.gz",
              "VBR WebUI Chinese Package/VBR-13.1.2.57/VBRWebUiZhCN-13.1.2.57-windows.zip",
              "VBR WebUI Chinese Package/VBR-13.1.2.57/VBRWebUiZhCN-13.1.2.57-full.zip",
              "VBR WebUI Chinese Package/VBR-13.1.2.57/SHA256SUMS-13.1.2.57.txt"
            ];

            const existing = (await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: release.id,
              per_page: 100
            })).map(asset => asset.name);

            for (const file of assets) {
              const assetName = path.basename(file);
              if (existing.includes(assetName)) continue;
              const data = fs.readFileSync(file);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name: assetName,
                data,
                headers: {
                  "content-type": "application/octet-stream",
                  "content-length": data.length
                }
              });
            }
