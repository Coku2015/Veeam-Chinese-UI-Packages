name: Fix VBR 13.1.2.57 Release Notes
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-vbr-13.1.2.57-release-notes.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update release notes
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const body = [
              "Veeam Backup & Replication Web UI 13.1.2.57 非官方简体中文本地化包。",
              "",
              "包含：",
              "- Windows Backup Server 安装包",
              "- Linux Appliance / VSA 安装包",
              "- Windows + Linux 完整包",
              "- SHA256 校验文件",
              "",
              "安装前请确认 Veeam Web UI build 与包版本一致，并先阅读仓库 README。"
            ].join("\n");
            const release = (await github.rest.repos.getReleaseByTag({
              owner,
              repo,
              tag: "v13.1.2.57"
            })).data;
            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.id,
              body
            });
